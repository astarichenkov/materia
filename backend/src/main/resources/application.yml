server:
  port: 8080

spring:
  application:
    name: lecture-processor
  datasource:
    url: jdbc:sqlite:${app.storage.root}/lecture-processor.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
  thymeleaf:
    cache: false

app:
  tools:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    whisper-path: ${WHISPER_PATH:whisper-cli}
    whisper-model-path: ${WHISPER_MODEL_PATH:}
    whisper-language: ru
    timeout: 2h
  storage:
    root: ${LECTURE_STORAGE_ROOT:./data}
  upload:
    max-file-size-bytes: 4294967296
  processing:
    worker-threads: 2
    queue-capacity: 20
    llm-chunk-chars: 6000
    llm-chunk-overlap-chars: 400
    # RAG retrieval chunks are intentionally smaller than generation chunks:
    # small sub-topic chunks improve recall, large chunks cut LLM call count.
    rag-chunk-chars: 400
    rag-chunk-overlap-chars: 60
    max-chunks-per-lecture: 200
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen3:4b}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimensions: 768
    timeout: ${OLLAMA_TIMEOUT:60m}
    # For qwen3:4b on Ollama, think:false makes the model leak chain-of-thought into
    # `content`. Keep thinking ENABLED: Ollama then separates reasoning into
    # `message.thinking` (ignored) and the clean answer into `message.content`.
    disable-thinking: ${OLLAMA_DISABLE_THINKING:false}
  slides:
    interval-seconds: 30
    max-images: 40
    hash-distance-threshold: 6
  chat:
    max-history-messages: 10
    max-question-chars: 2000
    retrieval-top-k: 5
    min-similarity: 0.2
  llm:
    providers:
      ollama:
        enabled: true
        display-name: "Ollama (local)"
      openai:
        enabled: false
        display-name: "OpenAI (не настроен)"
      deepseek:
        enabled: true
        display-name: "DeepSeek (Cloud)"
    # Provider used for embeddings. Embeddings stay local on purpose: the cloud
    # chat provider must never be silently substituted for embedding work.
    embedding-provider: ${EMBEDDING_PROVIDER:ollama}
    # Optional DeepSeek -> Ollama fallback. OFF by default because a silent
    # fallback changes result quality and is unacceptable for code review.
    fallback-enabled: ${LLM_FALLBACK_ENABLED:false}
  downloader:
    yt-dlp-path: ${YTDLP_PATH:yt-dlp}
    metadata-timeout: 2m
    download-timeout: 2h
    max-file-size-bytes: ${DOWNLOAD_MAX_BYTES:8589934592}
    default-quality: 720p
    # HTTPS-only by default; only enable in trusted local networks.
    allow-http: ${DOWNLOAD_ALLOW_HTTP:false}
    # Serialise CPU/GPU-heavy stages (whisper, LLM) to protect RAM/VRAM.
    heavy-stage-permits: ${HEAVY_STAGE_PERMITS:1}

  # Week 7 / Day 31 developer assistant.
  assistant:
    # Blank => auto-detect by walking up from the working directory.
    project-root: ${PROJECT_ROOT:}
    # Project-relative documentation indexed into the docs RAG.
    docs-paths: ${ASSISTANT_DOCS_PATHS:README.md,docs}
    max-file-bytes: 2000000
    chunk-chars: 1200
    chunk-overlap-chars: 150
    max-chunks-per-doc: 400
    retrieval-top-k: 6
    min-similarity: 0.15
    timeout: 2m
    auto-index: ${ASSISTANT_AUTO_INDEX:true}
    history-messages: 6

  # Week 7 / Day 34 autonomous file agent. Workspaces are explicit and separated:
  # project sources and a single lecture artifact directory.
  file-agent:
    enabled: ${FILE_AGENT_ENABLED:true}
    # Blank => ProjectRootResolver detection (walk up from the working directory).
    project-root: ${FILE_AGENT_PROJECT_ROOT:}
    lecture-workspace-enabled: ${FILE_AGENT_LECTURE_WORKSPACE:true}
    # Required for the external file-agent MCP profile; blank disables it.
    mcp-read-key: ${FILE_AGENT_MCP_KEY:}
    mcp-profile: file-agent-read
    allowed-extensions: ${FILE_AGENT_EXTENSIONS:java,md,txt,yml,yaml,xml,sql,properties,html,css,js,json,sh,ps1,gradle}
    # Readable but never writable by the agent.
    write-forbidden-globs: "AGENTS.md,pom.xml,mvnw,mvnw.cmd,**/pom.xml,**/mvnw,**/mvnw.cmd,.github/**,**/.github/**,backend/src/main/resources/application.yml,**/application.yml"
    protected-globs: "**/.env,**/.env.*,**/*.key,**/*.pem,**/*.p12,**/*.jks,**/*.keystore,**/id_rsa*,**/.git/**,**/.secrets/**,**/master.key,**/*credential*,**/data/**,**/target/**,**/build/**,**/node_modules/**,**/*.db,**/*.sqlite*,**/*.class,**/*.jar,**/*.docx,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.webp,**/*.zip,**/*.pdf"
    max-file-bytes: ${FILE_AGENT_MAX_FILE_BYTES:400000}
    max-files-per-task: ${FILE_AGENT_MAX_FILES:8}
    max-search-results: ${FILE_AGENT_MAX_SEARCH_RESULTS:30}
    max-read-lines: ${FILE_AGENT_MAX_READ_LINES:400}
    max-depth: ${FILE_AGENT_MAX_DEPTH:12}
    max-steps: ${FILE_AGENT_MAX_STEPS:10}
    max-tool-calls: ${FILE_AGENT_MAX_TOOL_CALLS:20}
    max-context-chars: ${FILE_AGENT_MAX_CONTEXT_CHARS:48000}
    max-patch-bytes: ${FILE_AGENT_MAX_PATCH_BYTES:140000}
    max-proposals: ${FILE_AGENT_MAX_PROPOSALS:6}
    timeout: ${FILE_AGENT_TIMEOUT:5m}
    goal-chars: ${FILE_AGENT_MAX_GOAL_CHARS:4000}

  # Week 7 / Day 33 support assistant. Tickets are scoped to this installation;
  # the app has no full user system, so local trust is documented explicitly.
  support:
    enabled: ${SUPPORT_ENABLED:true}
    install-scope: ${SUPPORT_INSTALL_SCOPE:local-install}
    # install = any local session may read the install's tickets;
    # session = additionally require the same owner cookie (horizontal isolation).
    isolation: ${SUPPORT_ISOLATION:install}
    assistant-prompt: support-assistant-v1
    # Explicit read-only allow-list. Git/filesystem developer tools are excluded.
    allowed-tools: ${SUPPORT_ALLOWED_TOOLS:get_job_status,get_stage_runs,get_job_diagnostics,get_model_health,get_ticket,list_ticket_messages,search_support_tickets,search_help_docs}
    max-tool-calls: ${SUPPORT_MAX_TOOL_CALLS:8}
    max-tool-result-chars: ${SUPPORT_MAX_TOOL_RESULT_CHARS:4000}
    max-question-chars: ${SUPPORT_MAX_QUESTION_CHARS:4000}
    max-history-messages: ${SUPPORT_MAX_HISTORY_MESSAGES:10}
    max-context-chars: ${SUPPORT_MAX_CONTEXT_CHARS:16000}
    max-llm-calls: ${SUPPORT_MAX_LLM_CALLS:2}
    retrieval-top-k: ${SUPPORT_RETRIEVAL_TOP_K:6}
    min-similarity: ${SUPPORT_MIN_SIMILARITY:0.15}
    timeout: ${SUPPORT_TIMEOUT:2m}

  # Read-only MCP tool surface (JSON-RPC 2.0 over HTTP POST /mcp).
  mcp:
    # Optional shared secret; blank keeps the endpoint open on localhost.
    api-key: ${MCP_API_KEY:}
    max-output-chars: 20000

  # Cloud chat provider (DeepSeek). Non-secret settings only; the API key is
  # entered per installation in the settings UI and encrypted at rest.
  deepseek:
    enabled: ${DEEPSEEK_ENABLED:true}
    # Official HTTPS endpoint. Custom endpoints require the allow-list policy.
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    models: ${DEEPSEEK_MODELS:deepseek-flash,deepseek-v4-flash,deepseek-chat,deepseek-reasoner}
    timeout: ${DEEPSEEK_TIMEOUT:60s}
    max-retries: ${DEEPSEEK_MAX_RETRIES:2}
    temperature: 0.1
    max-tokens: 1536
    context-window: 8192
    # Bounded parallelism and a soft budget warning for mass benchmark runs.
    max-concurrent-requests: ${DEEPSEEK_MAX_CONCURRENT:1}
    budget-warning-cost: ${DEEPSEEK_BUDGET_WARNING:0.0}
    # Cost ESTIMATES only. Set your own tariff; values are per 1M tokens.
    pricing:
      input-per-million-tokens: ${DEEPSEEK_PRICE_INPUT:0.0}
      output-per-million-tokens: ${DEEPSEEK_PRICE_OUTPUT:0.0}
      cache-hit-per-million-tokens: ${DEEPSEEK_PRICE_CACHE_HIT:0.0}
      currency: ${DEEPSEEK_PRICE_CURRENCY:USD}

  # Credential management guard. Blank => loopback-only admin access.
  security:
    admin-token: ${LP_ADMIN_TOKEN:}
    # Master key used to encrypt provider credentials at rest. The environment
    # variable (preferred) is read first; the file is a fallback created with
    # restricted permissions and must never be committed.
    master-key-env: ${LP_MASTER_KEY_ENV:LP_MASTER_KEY}
    master-key-path: ${LP_MASTER_KEY_PATH:${LECTURE_STORAGE_ROOT:./data}/.secrets/master.key}

  # Gitea integration for automated AI code review (Day 32).
  gitea:
    base-url: ${GITEA_BASE_URL:http://203.0.113.20:8108}
    # Secrets: env only, never committed. Header Authorization: token <...>.
    token: ${GITEA_TOKEN:}
    webhook-secret: ${GITEA_WEBHOOK_SECRET:}
    # Explicit allow-list of owner/repo that may be reviewed.
    allowed-repositories: ${GITEA_ALLOWED_REPOS:example-org/materia}
    timeout: ${GITEA_TIMEOUT:30s}
    # Homelab runs plain HTTP inside the trusted LAN; never expose publicly.
    allow-http: ${GITEA_ALLOW_HTTP:true}

  code-review:
    enabled: ${CODE_REVIEW_ENABLED:true}
    max-diff-chars: ${CODE_REVIEW_MAX_DIFF_CHARS:120000}
    max-files: ${CODE_REVIEW_MAX_FILES:40}
    max-context-chars: ${CODE_REVIEW_MAX_CONTEXT_CHARS:24000}
    max-findings: ${CODE_REVIEW_MAX_FINDINGS:15}
    max-llm-calls: ${CODE_REVIEW_MAX_LLM_CALLS:3}
    max-code-index-files: ${CODE_REVIEW_MAX_INDEX_FILES:150}
    max-code-index-chunks: ${CODE_REVIEW_MAX_INDEX_CHUNKS:1200}
    code-paths: ${CODE_REVIEW_CODE_PATHS:backend/src,private-ai-chat/src,pom.xml,backend/pom.xml,private-ai-chat/pom.xml}
    exclude-paths: ${CODE_REVIEW_EXCLUDE_PATHS:**/.env,**/*.key,**/*.pem,**/target/**,**/build/**,**/data/**,**/*.db,**/*.sqlite,**/node_modules/**}
    chunk-chars: 1800
    retrieval-top-k: 8
    min-similarity: 0.15
    auto-index: ${CODE_REVIEW_AUTO_INDEX:true}
    timeout: ${CODE_REVIEW_TIMEOUT:5m}
    # Pull-based fallback: detects new PR head SHAs when Gitea cannot reach Windows.
    polling-enabled: ${CODE_REVIEW_POLLING:true}
    poll-interval-seconds: ${CODE_REVIEW_POLL_SECONDS:60}
    publish: ${CODE_REVIEW_PUBLISH:true}


  translation:
    enabled: ${TRANSLATION_ENABLED:true}
    default-language-mode: ${TRANSLATION_DEFAULT_LANGUAGE_MODE:AUTO}
    default-translation-mode: ${TRANSLATION_DEFAULT_MODE:TRANSLATE_TO_RUSSIAN}
    target-language: ${TRANSLATION_TARGET_LANGUAGE:ru}
    auto-translate: ${TRANSLATION_AUTO:true}
    preserve-original: true
    prompt-template: lecture-translation-v1
    prompt-version: v3
    glossary-version: v1
    max-batch-chars: ${TRANSLATION_MAX_BATCH_CHARS:2000}
    max-segments-per-batch: ${TRANSLATION_MAX_SEGMENTS:4}
    max-retries: ${TRANSLATION_MAX_RETRIES:1}
    max-llm-calls: ${TRANSLATION_MAX_LLM_CALLS:200}
    token-budget: ${TRANSLATION_TOKEN_BUDGET:200000}
    timeout: ${TRANSLATION_TIMEOUT:3m}

  # Day 35 lecture editor: revision limits, size guards and cloud-retry consent.
  editor:
    enabled: ${EDITOR_ENABLED:true}
    max-revisions-per-document: ${EDITOR_MAX_REVISIONS:100}
    max-segment-chars: ${EDITOR_MAX_SEGMENT_CHARS:8000}
    max-notes-chars: ${EDITOR_MAX_NOTES_CHARS:400000}
    max-batch-segments: ${EDITOR_MAX_BATCH_SEGMENTS:500}
    max-description-chars: ${EDITOR_MAX_DESCRIPTION_CHARS:500}
    # Cloud retry is additionally OFF by default in the UI setting and only
    # becomes usable when this flag and the user toggle are both enabled.
    allow-cloud-retry: ${EDITOR_ALLOW_CLOUD_RETRY:false}
    max-cloud-retries: ${EDITOR_MAX_CLOUD_RETRIES:30}
    preview-max-chars: ${EDITOR_PREVIEW_MAX_CHARS:200000}

  # Week 8 smart video discovery.
  discovery:
    enabled: ${DISCOVERY_ENABLED:true}
    cache-ttl: ${DISCOVERY_CACHE_TTL:24h}
    error-cache-ttl: ${DISCOVERY_ERROR_CACHE_TTL:10m}
    max-results-per-provider: ${DISCOVERY_MAX_RESULTS_PER_PROVIDER:15}
    max-results: ${DISCOVERY_MAX_RESULTS:20}
    max-queries: ${DISCOVERY_MAX_QUERIES:3}
    similarity-top-k: ${DISCOVERY_SIMILARITY_TOP_K:8}
    min-similarity: ${DISCOVERY_MIN_SIMILARITY:0.25}
    min-online-relevance: ${DISCOVERY_MIN_ONLINE_RELEVANCE:0.20}
    keyword-bonus-weight: ${DISCOVERY_KEYWORD_BONUS:0.10}
    providers: ${DISCOVERY_PROVIDERS:youtube,vkontakte,rutube}
    request-timeout: ${DISCOVERY_REQUEST_TIMEOUT:20s}
    max-response-bytes: 2000000
    youtube-api-base: ${YOUTUBE_API_BASE:https://www.googleapis.com/youtube/v3}
    vk-api-base: ${VK_API_BASE:https://api.vk.com/method}
    rutube-api-base: ${RUTUBE_API_BASE:https://rutube.ru/api}
    exclude-private-query-terms: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  # Week 8 multilingual lecture processing.
