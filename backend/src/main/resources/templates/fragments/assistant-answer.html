<div xmlns:th="http://www.thymeleaf.org" class="box">
    <div th:if="${error}" class="answer err">
        <b>Ошибка:</b> <span th:text="${error}"></span>
    </div>
    <div th:if="${answer}" class="answer" th:text="${answer.answer}"></div>
    <div th:if="${answer != null and !#lists.isEmpty(answer.toolCalls)}" class="citations">
        <b>MCP-инструменты:</b>
        <span th:each="call : ${answer.toolCalls}"
              th:text="${call.name} + (${call.ok} ? ' ✓' : ' ✗') + ' '"></span>
    </div>
    <div th:if="${answer != null and !#lists.isEmpty(answer.citations)}" class="citations">
        <b>Источники:</b>
        <ul>
            <li th:each="citation : ${answer.citations}">
                <code th:text="${citation.sourcePath} + '#' + ${citation.sequence}"></code>
                <span th:text="${citation.heading}"></span>
            </li>
        </ul>
    </div>
</div>
