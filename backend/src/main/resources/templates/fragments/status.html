<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Live job/status block. `data-status` keeps the effective state, `data-raw-status`
  the persisted checkpoint state and `data-job-status`/`data-lecture-status` the
  persisted container states. Diagnostic information is therefore never lost,
  even when the view resolves a historical contradiction (JOB=CANCELLED,
  STAGE=RUNNING).
-->
<div th:fragment="status"
     th:with="displayStatus=${job != null ? job.status : lecture.status.name()},
              live=${job != null ? !job.terminal : !lecture.status.terminal}"
     th:attr="hx-get=${live ? '/lectures/' + lecture.id + '/status' : null},
              hx-trigger=${live ? 'every 3s' : null},
              hx-swap='outerHTML',
              data-status=${displayStatus},
              data-job-status=${job != null ? job.jobState : null},
              data-lecture-status=${lecture.status.name()}">
    <p>
        Статус:
        <span th:replace="~{fragments/status-badge :: badge(${displayStatus})}"></span>
        <span class="muted" th:if="${job != null and job.rawStatus != null and job.rawStatus != job.status}"
              th:text="'· в базе: ' + ${job.rawStatus}"></span>
    </p>

    <div th:if="${job != null}">
        <!--
          Current-run block: progress of THIS regeneration, not the accumulated
          pipeline history. `data-run-id` lets tests/UI follow the actual run.
        -->
        <div class="run-progress" th:if="${job.run != null}"
             th:attr="data-run-id=${job.run.id},data-run-state=${job.run.state}">
            <p>
                <b>Текущий запуск</b>
                <span class="badge badge--neutral" th:text="${job.run.stateLabel}">Состояние</span>
                <span class="muted" th:text="' · ID ' + ${#strings.substring(job.run.id, 0, 8)}"></span>
            </p>
            <p th:if="${job.run.currentStageTitle != null}">
                Этап:
                <b th:text="${job.run.currentStageTitle}"></b>
                <span class="muted" th:text="' · ' + ${job.run.doneStages} + ' из ' + ${job.run.totalStages} + ' стадий'"></span>
            </p>
            <p class="muted" th:if="${job.run.stageProgress != null}"
               th:text="'Прогресс этапа: ' + ${job.run.stageProgress}"></p>
            <progress th:value="${job.run.percent}" max="100"
                      th:attr="aria-label='Прогресс текущего запуска'"></progress>
            <span th:text="${job.run.percent} + '%'"></span>
            <p th:if="${job.run.message != null and !#strings.isEmpty(job.run.message)}"
               th:text="${job.run.message}"></p>
            <ul class="run-stages" th:if="${job.run.stages != null and !job.run.stages.isEmpty()}">
                <li th:each="runStage : ${job.run.stages}"
                    th:attr="data-stage=${runStage.stage},data-state=${runStage.state}">
                    <span th:text="${runStage.title}"></span>
                    <span th:switch="${runStage.state}">
                        <span th:case="'COMPLETED'" class="muted"> — готово</span>
                        <span th:case="'RUNNING'" class="muted"> — выполняется</span>
                        <span th:case="'PENDING'" class="muted"> — ожидает</span>
                        <span th:case="'CANCELLED'" class="muted"> — отменено</span>
                        <span th:case="*" class="muted"> — не выполнялось</span>
                    </span>
                    <span class="muted" th:if="${runStage.detail != null}" th:text="' · ' + ${runStage.detail}"></span>
                </li>
            </ul>
        </div>

        <p>
            <span th:text="${job.terminal ? 'Последний этап:' : 'Этап:'}">Этап:</span>
            <span th:if="${job.currentStageTitle != null}" th:text="${job.currentStageTitle}">—</span>
            <span th:unless="${job.currentStageTitle != null}" th:text="'ожидание'">ожидание</span>
            (<span th:text="${job.stageIndex}">0</span>/<span th:text="${job.totalStages}">0</span>)
        </p>
        <p th:if="${job.message != null and !#strings.isEmpty(job.message)}"
           th:text="${job.message}"></p>
        <progress th:value="${job.progressPercent}" max="100"
                  th:attr="aria-label=${job.terminal ? 'Достигнутый прогресс обработки' : 'Прогресс обработки'}"></progress>
        <span th:text="${job.progressPercent} + '%'"></span>
        <span class="muted" th:if="${job.terminal and job.status != 'COMPLETED' and job.status != 'PARTIAL'}"> · обработка остановлена, дальнейшие этапы не запускались</span>

        <div th:if="${job.download != null}">
            <p>
                Скачивание:
                <span th:switch="${job.download.status}">
                    <span th:case="'FINISHED'">Завершено</span>
                    <span th:case="'DOWNLOADING'">Скачивание</span>
                    <span th:case="*" th:text="${job.download.status}">—</span>
                </span>
                <span th:if="${job.download.percent != null}"
                      th:text="' · ' + ${#numbers.formatDecimal(job.download.percent, 1, 1)} + '%'"></span>
                <span th:if="${job.download.bytesDownloaded != null}"
                      th:text="' · скачано ' + ${#numbers.formatDecimal(job.download.bytesDownloaded / 1048576.0, 1, 1)} + ' МБ'"></span>
                <span th:if="${job.download.bytesTotal != null}"
                      th:text="' из ' + ${#numbers.formatDecimal(job.download.bytesTotal / 1048576.0, 1, 1)} + ' МБ'"></span>
                <span th:if="${job.download.speedBps != null}"
                      th:text="' · ' + ${#numbers.formatDecimal(job.download.speedBps / 1048576.0, 1, 2)} + ' МБ/с'"></span>
                <span th:if="${job.download.etaSeconds != null}"
                      th:text="' · ETA ' + ${job.download.etaSeconds} + ' c'"></span>
            </p>
        </div>

        <table th:if="${job.stages != null}">
            <caption class="visually-hidden">Этапы обработки и их фактические состояния</caption>
            <thead><tr><th scope="col">Этап</th><th scope="col">Состояние</th><th scope="col">Ошибка</th></tr></thead>
            <tbody>
            <tr th:each="stage : ${job.stages}">
                <td th:text="${stage.title}"></td>
                <td>
                    <span th:replace="~{fragments/status-badge :: badge(${stage.state})}"></span>
                    <span class="muted" th:if="${stage.rawState != stage.state}"
                          th:text="' · в базе: ' + ${stage.rawState}"></span>
                </td>
                <td th:text="${stage.error}"></td>
            </tr>
            </tbody>
        </table>

        <ul class="warn" th:if="${job.warnings != null and !job.warnings.isEmpty()}">
            <li th:each="w : ${job.warnings}" th:text="${w}"></li>
        </ul>
    </div>

    <p th:if="${lecture.durationMs != null}" th:text="'Длительность: ' + ${lecture.durationMs} + ' мс'"></p>
    <p class="error" th:if="${lecture.errorMessage}" th:text="'Ошибка: ' + ${lecture.errorMessage}"></p>
</div>
</body>
</html>
