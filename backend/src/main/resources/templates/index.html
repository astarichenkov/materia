<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lecture Processor</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1000px; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
        .status-COMPLETED { color: #0a7d28; font-weight: 600; }
        .status-FAILED { color: #b00020; font-weight: 600; }
        .msg { padding: .6rem; background: #eef; margin-bottom: 1rem; }
        .err { background: #fee; color: #b00020; }
        .source-box { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
        .source-box h3 { margin-top: 0; }
        fieldset { border: 1px solid #ddd; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .6rem; margin: .6rem 0; }
    </style>
</head>
<body>
<h1>Lecture Processor</h1>
<div th:if="${message}" class="msg" th:text="${message}"></div>
<div th:if="${error}" class="msg err" th:text="${error}"></div>

<div class="source-box">
    <h3>Локальный файл</h3>
    <form method="post" action="/lectures" enctype="multipart/form-data">
        <input type="file" name="file" accept="video/*" required>
        <label><input type="checkbox" name="clean"> очистка транскрипта</label>
        <label><input type="checkbox" name="slides"> извлечь слайды</label>
        <div class="grid">
            <label>Язык источника
                <select name="languageMode">
                    <option value="AUTO" selected>Auto</option>
                    <option value="ENGLISH">English</option>
                    <option value="RUSSIAN">Russian</option>
                </select>
            </label>
            <label>Перевод
                <select name="translationMode">
                    <option value="TRANSLATE_TO_RUSSIAN" selected>Русский</option>
                    <option value="BILINGUAL">Двуязычный</option>
                    <option value="ORIGINAL_ONLY">Только оригинал</option>
                </select>
            </label>
            <label><input type="checkbox" name="autoTranslate" checked> авто-перевод EN</label>
        </div>
        <button type="submit">Загрузить и обработать</button>
    </form>
</div>

<div class="source-box">
    <h3>Видео по ссылке</h3>
    <p>Поддерживаются YouTube, VK Видео, VK, Rutube.</p>
    <form hx-get="/lectures/preview" hx-target="#preview" hx-swap="innerHTML"
          onsubmit="return false;" style="margin-bottom:.6rem">
        <input type="url" name="url" placeholder="https://..." size="60" required>
        <button type="submit">Проверить</button>
    </form>
    <div id="preview"></div>
    <form method="post" action="/lectures/from-url">
        <input type="url" name="url" placeholder="https://..." size="60" required>
        <select name="quality">
            <option value="auto">Auto</option>
            <option value="480p">480p</option>
            <option value="720p" selected>720p</option>
            <option value="1080p">1080p</option>
        </select>
        <label><input type="checkbox" name="audioOnly"> только аудио</label>
        <label><input type="checkbox" name="clean"> очистка транскрипта</label>
        <label><input type="checkbox" name="slides"> извлечь слайды</label>
        <div class="grid">
            <label>Язык источника
                <select name="languageMode">
                    <option value="AUTO" selected>Auto</option>
                    <option value="ENGLISH">English</option>
                    <option value="RUSSIAN">Russian</option>
                </select>
            </label>
            <label>Перевод
                <select name="translationMode">
                    <option value="TRANSLATE_TO_RUSSIAN" selected>Русский</option>
                    <option value="BILINGUAL">Двуязычный</option>
                    <option value="ORIGINAL_ONLY">Только оригинал</option>
                </select>
            </label>
            <label><input type="checkbox" name="autoTranslate" checked> авто-перевод EN</label>
        </div>
        <button type="submit">Скачать и обработать</button>
    </form>
</div>

<table>
    <thead>
    <tr><th>Файл</th><th>Статус</th><th>Создано</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="lecture : ${lectures}">
        <td th:text="${lecture.originalFilename}"></td>
        <td th:classappend="'status-' + ${lecture.status}" th:text="${lecture.status}"></td>
        <td th:text="${lecture.createdAt}"></td>
        <td><a th:href="@{/lectures/{id}(id=${lecture.id})}">Открыть</a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(lectures)}"><td colspan="4">Пока нет лекций</td></tr>
    </tbody>
</table>
<p><a href="/discover">Smart Video Discovery</a> · <a href="/benchmarks">Бенчмарки</a> ·
    <a href="/assistant">Ассистент разработчика</a></p>
</body>
</html>
