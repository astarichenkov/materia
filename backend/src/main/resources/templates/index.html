<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lecture Processor</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<a class="skip-link" href="#main">К содержимому</a>
<header th:replace="~{fragments/layout :: appbar('overview', 'Обзор')}"></header>
<div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar('overview')}"></aside>
<main id="main" class="content" tabindex="-1">
<nav th:replace="~{fragments/layout :: breadcrumbs('', '', '')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<noscript><div class="alert alert--warning" role="alert">Часть интерактивных действий (обновление статуса, превью ссылки, чат) требует JavaScript. Обычные формы работают без него.</div></noscript>

<h1>Lecture Processor</h1>
<div th:if="${error}" class="alert alert--danger" role="alert" th:text="${error}"></div>

<div class="source-box" id="upload">
    <h3>Локальный файл</h3>
    <form method="post" action="/lectures" enctype="multipart/form-data">
        <label for="lecture-file">Видеофайл</label>
        <input id="lecture-file" type="file" name="file" accept="video/*" required>
        <label><input type="checkbox" name="clean"> очистка транскрипта</label>
        <label><input type="checkbox" name="slides"> извлечь слайды</label>
        <div class="grid">
            <label>Язык источника
                <select name="languageMode">
                    <option value="AUTO" selected>Auto</option>
                    <option value="ENGLISH">English</option>
                    <option value="RUSSIAN">Russian</option>
                </select>
            </label>
            <label>Перевод
                <select name="translationMode">
                    <option value="TRANSLATE_TO_RUSSIAN" selected>Русский</option>
                    <option value="BILINGUAL">Двуязычный</option>
                    <option value="ORIGINAL_ONLY">Только оригинал</option>
                </select>
            </label>
            <label><input type="checkbox" name="autoTranslate" checked> авто-перевод EN</label>
        </div>
        <button type="submit">Загрузить и обработать</button>
    </form>
</div>

<div class="source-box">
    <h3>Видео по ссылке</h3>
    <p>Поддерживаются YouTube, VK Видео, VK, Rutube.</p>
    <form hx-get="/lectures/preview" hx-target="#preview" hx-swap="innerHTML"
          action="/lectures/preview" method="get" style="margin-bottom:.6rem">
        <label for="preview-url" class="visually-hidden">Ссылка на видео для проверки</label>
        <input id="preview-url" type="url" name="url" placeholder="https://..." size="60" required>
        <button type="submit">Проверить</button>
    </form>
    <div id="preview"></div>
    <form method="post" action="/lectures/from-url">
        <label for="download-url">Ссылка на видео</label>
        <input id="download-url" type="url" name="url" placeholder="https://..." size="60" required>
        <select name="quality">
            <option value="auto">Auto</option>
            <option value="480p">480p</option>
            <option value="720p" selected>720p</option>
            <option value="1080p">1080p</option>
        </select>
        <label><input type="checkbox" name="audioOnly"> только аудио</label>
        <label><input type="checkbox" name="clean"> очистка транскрипта</label>
        <label><input type="checkbox" name="slides"> извлечь слайды</label>
        <div class="grid">
            <label>Язык источника
                <select name="languageMode">
                    <option value="AUTO" selected>Auto</option>
                    <option value="ENGLISH">English</option>
                    <option value="RUSSIAN">Russian</option>
                </select>
            </label>
            <label>Перевод
                <select name="translationMode">
                    <option value="TRANSLATE_TO_RUSSIAN" selected>Русский</option>
                    <option value="BILINGUAL">Двуязычный</option>
                    <option value="ORIGINAL_ONLY">Только оригинал</option>
                </select>
            </label>
            <label><input type="checkbox" name="autoTranslate" checked> авто-перевод EN</label>
        </div>
        <button type="submit">Скачать и обработать</button>
    </form>
</div>

<form method="get" action="/" class="source-box">
    <h3>Библиотека лекций</h3>
    <div class="grid">
        <label>Поиск по названию/теме
            <input name="q" th:value="${q}" placeholder="например: RAG">
        </label>
        <label>Язык
            <input name="language" th:value="${language}" size="4" placeholder="en / ru">
        </label>
        <label>Статус
            <select name="status">
                <option value="">Любой</option>
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${statusLabels[s.name()]}"
                        th:selected="${status == s.name()}"></option>
            </select>
        </label>
        <label>Перевод
            <select name="hasTranslation">
                <option value="">Не важно</option>
                <option value="true" th:selected="${hasTranslation == true}">Есть перевод</option>
                <option value="false" th:selected="${hasTranslation == false}">Без перевода</option>
            </select>
        </label>
        <label>Сортировка
            <select name="sort">
                <option value="date-desc" th:selected="${sort == 'date-desc'}">Сначала новые</option>
                <option value="date-asc" th:selected="${sort == 'date-asc'}">Сначала старые</option>
                <option value="title" th:selected="${sort == 'title'}">По названию</option>
            </select>
        </label>
        <label>&nbsp;<button type="submit">Применить</button></label>
    </div>
</form>

<table>
    <thead>
    <tr><th>Лекция</th><th>Язык</th><th>Статус</th><th>Перевод</th><th>Создано</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td>
            <div th:text="${item.title}"></div>
            <div class="muted" th:if="${item.title != item.filename}" th:text="${item.filename}"></div>
        </td>
        <td th:text="${item.detectedLanguage ?: '—'}"></td>
        <td><span th:replace="~{fragments/status-badge :: badge(${item.status.name()})}"></span></td>
        <td>
            <span th:if="${item.hasTranslation}" class="ok"
                  th:text="${item.segmentsTranslated} + '/' + ${item.segmentsTotal}"></span>
            <span th:unless="${item.hasTranslation}" class="muted">нет</span>
        </td>
        <td th:text="${item.createdAt}"></td>
        <td>
            <a th:href="@{/lectures/{id}(id=${item.lectureId})}">Открыть</a>
            · <a th:href="@{/lectures/{id}/editor(id=${item.lectureId})}">Редактор</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(items)}"><td colspan="6">Пока нет лекций</td></tr>
    </tbody>
</table>


</main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
