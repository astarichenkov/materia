<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ассистент разработчика</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<a class="skip-link" href="#main">К содержимому</a>
<header th:replace="~{fragments/layout :: appbar('assistant', 'Developer Assistant')}"></header>
<div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar('assistant')}"></aside>
<main id="main" class="content" tabindex="-1">
<nav th:replace="~{fragments/layout :: breadcrumbs('Инструменты разработчика', '', 'Developer Assistant')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<noscript><div class="alert alert--warning" role="alert">Часть интерактивных действий (обновление статуса, превью ссылки, чат) требует JavaScript. Обычные формы работают без него.</div></noscript>

<h1>Ассистент разработчика</h1>


<div th:if="${error}" class="alert alert--danger" role="alert" th:text="${error}"></div>

<div class="box">
    <h3>Документация в RAG</h3>
    <p>
        Корень проекта: <code th:text="${status.projectRoot}"></code><br>
        Источников: <b th:text="${status.sourceCount}"></b>,
        фрагментов: <b th:text="${status.chunkCount}"></b><br>
        Последняя индексация:
        <span th:text="${status.lastIndexedAt ?: 'нет'}"></span>
    </p>
    <ul>
        <li th:each="source : ${status.sources}" th:text="${source}"></li>
    </ul>
    <form method="post" action="/assistant/reindex">
        <button type="submit">Переиндексировать документацию</button>
    </form>
</div>

<div class="box">
    <h3>Read-only MCP инструменты</h3>
    <div class="tools">
        <span th:each="tool : ${tools}" th:text="${tool.name}" th:title="${tool.description}"></span>
    </div>
</div>

<div class="box">
    <h3>Команда <code>/help</code></h3>
    <form hx-post="/assistant/help" hx-target="#answer" hx-swap="innerHTML"
          th:with="assistantSession=${#strings.randomAlphanumeric(12)}">
        <input type="hidden" name="session" th:value="${assistantSession}"/>
        <textarea name="question" rows="3" placeholder="/help Из чего состоит пайплайн обработки лекции?"></textarea>
        <button type="submit">Спросить</button>
    </form>
</div>

<div id="answer"></div>

</main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
