<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Чат: ' + ${lecture.originalFilename}">Чат</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<a class="skip-link" href="#main">К содержимому</a>
<header th:replace="~{fragments/layout :: appbar('library', 'Чат по материалу')}"></header>
<div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar('library')}"></aside>
<main id="main" class="content" tabindex="-1">
<nav th:replace="~{fragments/layout :: breadcrumbs('Библиотека', '/library', 'Чат по материалу')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<noscript><div class="alert alert--warning" role="alert">Часть интерактивных действий (обновление статуса, превью ссылки, чат) требует JavaScript. Обычные формы работают без него.</div></noscript>

<h1 th:text="'Чат по материалу: ' + ${lecture.originalFilename}"></h1>


<form th:attr="hx-post='/lectures/' + ${lecture.id} + '/chat'"
      hx-target="#answer" hx-swap="innerHTML">
    <input type="hidden" name="session" th:value="${sessionId}"/>
    <textarea name="question" maxlength="2000" placeholder="Задайте вопрос по материалу..." required></textarea>
    <button type="submit">Спросить</button>
</form>

<div id="answer">
    <p>Задайте вопрос. Ответ будет основан на найденных фрагментах материала.</p>
</div>

</main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
