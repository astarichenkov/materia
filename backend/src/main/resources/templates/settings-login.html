<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в настройки</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 30rem; }
        input, button { padding: .5rem; width: 100%; box-sizing: border-box; }
        .msg { padding: .6rem; background: #eef; margin-bottom: 1rem; }
        .err { background: #fee; color: #b00020; }
    </style>
</head>
<body>
<h1>Административный вход</h1>
<a href="/">← К лекциям</a>

<div th:if="${error}" class="msg err" th:text="${error}"></div>

<p>Управление API-ключами провайдеров защищено административным токеном
(<code>app.security.admin-token</code>).</p>

<form method="post" action="/settings/login">
    <label for="adminToken">Административный токен</label>
    <input type="password" id="adminToken" name="adminToken" autocomplete="off">
    <p><button type="submit">Войти</button></p>
</form>

<p th:unless="${adminTokenConfigured}">
    Токен не настроен: доступ разрешён только с localhost. Задайте
    <code>LP_ADMIN_TOKEN</code> для защищённого удалённого доступа.
</p>
</body>
</html>
